;show_widget=true

[@SOC Table]

[SOC Table?header]
;mode=table
;polling=true
;background=false
;header_indent=true
;section_text_color=header
;info_text_color=section
ini_file './config.ini'
'SOC Table' = 'Speedo {soc_speedo}'

[*1866 MHz?SOCVOLTmariko]
;system=mariko
;mode=option
;mini=true
;selection_mini=true
json_file_source './mariko/soc_volt.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 424 {json_file_source(*,hex)}
set-ini-val './config.ini' 'globals' 'crc32' '{crc32(/atmosphere/kips/hoc.kip)}'
mv ./notifications/hoc-reboot_required_once.notify /config/ultrahand/notifications/
set-footer '{json_file_source(*,name)}'
; --- sync changed value into hoc-clk config.ini when flag present (no kip reread) ---
try:
path_exists ./flags/UPDATE_HOC_CONFIG.flag
set-ini-val /config/horizon-oc/config.ini values g_soc_volt_1866000 {hex_to_decimal({hex_to_rhex({json_file_source(*,hex)})})}
set-ini-val /config/horizon-oc/config.ini values is_first_load 1
try:
pass

