[@Software Update]

[Software Update]
;mode=table
;background=false
;header_indent=true
;section_text_color=header
;info_text_color=section
hex_file /atmosphere/kips/hoc.kip
'Software Update'='Kip Rev 2KIP Rev {hex_to_decimal({hex_to_rhex({hex_file(CUST,4,4)})})}'

[Update All]
try:

delete /config/ultrahand/downloads/hoc-toolkit.zip
download https://raw.githubusercontent.com/ppkantorski/HOC-Toolkit/refs/heads/main/RELEASE.ini './RELEASE.ini'
ini_file './RELEASE.ini'
download "https://github.com/ppkantorski/HOC-Toolkit/releases/download{ini_file(Release Info,latest_hoc_toolkit)}/hoc-toolkit.zip" /config/ultrahand/downloads/
unzip /config/ultrahand/downloads/hoc-toolkit.zip /
delete /config/ultrahand/downloads/hoc-toolkit.zip

delete /config/ultrahand/downloads/Status-Monitor-Overlay.ovl
download "https://github.com/ppkantorski/Status-Monitor-Overlay/releases/download/v{ini_file(Release Info,latest_status_monitor)}/Status-Monitor-Overlay.ovl" /config/ultrahand/downloads/
mv /config/ultrahand/downloads/Status-Monitor-Overlay.ovl /switch/.overlays/

delete /config/ultrahand/downloads/sys-clk/sys-clk-overlay.ovl
download "https://github.com/ppkantorski/sys-clk/releases/download/{ini_file(Release Info,latest_sys-clk)}/sys-clk-overlay.ovl" /config/ultrahand/downloads/
mv /config/ultrahand/downloads/sys-clk/sys-clk-overlay.ovl /switch/.overlays/

delete /config/ultrahand/downloads/sys-clk-hoc.zip
download "https://github.com/ppkantorski/Horizon-OC/releases/download/{ini_file(Release Info,latest_sys-clk-hoc)}/sys-clk-hoc.zip" /config/ultrahand/downloads/
unzip /config/ultrahand/downloads/sys-clk-hoc.zip /
delete /config/ultrahand/downloads/sys-clk-hoc.zip

delete /config/ultrahand/downloads/hoc/
mkdir /config/ultrahand/downloads/hoc/
download "https://github.com/Horizon-OC/Horizon-OC/releases/download/{ini_file(Release Info,latest_hoc)}/dist.zip" /config/ultrahand/downloads/hoc/
unzip /config/ultrahand/downloads/hoc/dist.zip /config/ultrahand/downloads/hoc/
exec cBackupKip ./global_cmds.ini
mv /config/ultrahand/downloads/hoc/atmosphere/kips/hoc.kip /atmosphere/kips/hoc.kip
exec cRestoreKip ./global_cmds.ini
exec boot
delete /config/ultrahand/downloads/hoc/

exit


