;title='HOC Toolkit'
;version=2.0.1
;creator='ppkantorski, B3711, NaGa'
;about='Designed for advanced OC configurations. Use with caution and proper guidance.'
;color=green
;show_widget=true
;show_version=true

[@Software Update]

[Software Update]
;mode=table
;background=false
;header_indent=true
;section_text_color=header
;info_text_color=section
hex_file /atmosphere/kips/hoc.kip

; --- kip rev is hard coded to 3 here ---
json '{"3":"","null":""}'
'Software Update'='KIP Rev 3{json({hex_to_decimal({hex_to_rhex({hex_file(CUST,4,4)})})})}'

[Update All?main]
try:
delete './RELEASE.ini'
download https://raw.githubusercontent.com/ppkantorski/HOC-Toolkit/refs/heads/main/RELEASE.ini './RELEASE.ini'
path_exists './RELEASE.ini'
ini_file './RELEASE.ini'

; --- UPDATE HOC TOOLKIT ---
notify 'Updating HOC Toolkit.' "HOC Toolkit" hoc
delete /config/ultrahand/downloads/hoc-toolkit/
mkdir /config/ultrahand/downloads/hoc-toolkit/
cp ./include/backup/config.ini /config/ultrahand/downloads/hoc-toolkit/backup_config.ini
cp ./flags/ /config/ultrahand/downloads/hoc-toolkit/flags/

download "https://github.com/ppkantorski/HOC-Toolkit/releases/download/v{ini_file(HOC Toolkit,version)}/{ini_file(HOC Toolkit,filename)}" /config/ultrahand/downloads/hoc-toolkit/
mv './RELEASE.ini' /config/ultrahand/downloads/hoc-toolkit/
delete ./
mkdir ./
mv /config/ultrahand/downloads/hoc-toolkit/RELEASE.ini './RELEASE.ini'
unzip '/config/ultrahand/downloads/hoc-toolkit/{ini_file(HOC Toolkit,filename)}' /
mv /config/ultrahand/downloads/hoc-toolkit/backup_config.ini ./include/backup/config.ini
delete ./flags/*.flag
mv /config/ultrahand/downloads/hoc-toolkit/flags/ ./flags/

; --- UPDATE HORIZON OC ---
notify 'Updating Horizon OC.' "HOC Toolkit" hoc
delete /config/ultrahand/downloads/hoc/
mkdir /config/ultrahand/downloads/hoc/
download "https://github.com/Horizon-OC/Horizon-OC/releases/download/{ini_file(Horizon OC,version)}/{ini_file(Horizon OC,filename)}" /config/ultrahand/downloads/hoc/
mkdir './data/horizon-oc/'
unzip '/config/ultrahand/downloads/hoc/{ini_file(Horizon OC,filename)}' './data/horizon-oc/'

exec cBackupKip ./global_cmds.ini
cp './data/horizon-oc/atmosphere/kips/hoc.kip' /atmosphere/kips/hoc.kip

clear hex_sum_cache

hex_file /atmosphere/kips/hoc.kip

; --- kip rev is hard coded to 3 here ---
json '{"3":"exec","null":";pass"}'
{json({hex_to_decimal({hex_to_rhex({hex_file(CUST,4,4)})})})} cRestoreKip ./global_cmds.ini

; --- kip rev is hard coded to 3 here ---
json '{"3":";pass","null":"notify-now"}'
{json({hex_to_decimal({hex_to_rhex({hex_file(CUST,4,4)})})})} "Backup skipped." "HOC Toolkit" hoc

delete /config/ultrahand/downloads/hoc/


; --- UPDATE SYS-CLK-HOC ---
notify 'Updating sys-clk-hoc.' "HOC Toolkit" hoc
delete /config/ultrahand/downloads/sys-clk-hoc/
mkdir /config/ultrahand/downloads/sys-clk-hoc/
download "https://github.com/ppkantorski/Horizon-OC/releases/download/{ini_file(sys-clk-hoc,version)}/{ini_file(sys-clk-hoc,filename)}" /config/ultrahand/downloads/sys-clk-hoc/
unzip '/config/ultrahand/downloads/sys-clk-hoc/{ini_file(sys-clk-hoc,filename)}' ./data/sys-clk-hoc/
cp ./data/sys-clk-hoc/ /
delete /config/ultrahand/downloads/sys-clk-hoc/

; --- UPDATE SYS-CLK ---
notify 'Updating sys-clk.' "HOC Toolkit" hoc
delete ./data/sys-clk-hoc/switch/.overlays/
mkdir ./data/sys-clk-hoc/switch/.overlays/
download "https://github.com/ppkantorski/sys-clk/releases/download/{ini_file(sys-clk,version)}/{ini_file(sys-clk,filename)}" ./data/sys-clk-hoc/switch/.overlays/
cp './data/sys-clk-hoc/switch/.overlays/{ini_file(sys-clk,filename)}' /switch/.overlays/

; --- UPDATE STATUS-MONITOR ---
notify 'Updating Status Monitor.' "HOC Toolkit" hoc
delete /config/ultrahand/downloads/Status-Monitor/
mkdir /config/ultrahand/downloads/Status-Monitor/
download "https://github.com/ppkantorski/Status-Monitor-Overlay/releases/download/v{ini_file(Status Monitor,version)}/{ini_file(Status Monitor,filename)}" /config/ultrahand/downloads/Status-Monitor/
mv '/config/ultrahand/downloads/Status-Monitor/{ini_file(Status Monitor,filename)}' /switch/.overlays/

download "https://github.com/masagrator/SaltyNX/releases/download/{ini_file(SaltyNX,version)}/{ini_file(SaltyNX,filename)}" /config/ultrahand/downloads/Status-Monitor/
unzip "/config/ultrahand/downloads/Status-Monitor/{ini_file(SaltyNX,filename)}" /

delete /config/ultrahand/downloads/Status-Monitor/


; --- UPDATE ULTRAHAND ---
notify 'Updating Ultrahand.' "HOC Toolkit" hoc
delete /config/ultrahand/downloads/ULTRAHAND_RELEASE.ini
download https://raw.githubusercontent.com/ppkantorski/Ultrahand-Overlay/refs/heads/main/RELEASE.ini /config/ultrahand/downloads/ULTRAHAND_RELEASE.ini
ini_file '/config/ultrahand/downloads/ULTRAHAND_RELEASE.ini'

json '{"null":"download","{ini_file(Release Info,latest_version)}":";pass"}'
'{json({ultrahand_version})}' 'https://github.com/ppkantorski/Ultrahand-Overlay/releases/download/{ini_file(Release Info,latest_version)}/sdout.zip' /config/ultrahand/downloads/hoc-toolkit/
json '{"null":"unzip","{ini_file(Release Info,latest_version)}":";pass"}'
'{json({ultrahand_version})}' /config/ultrahand/downloads/hoc-toolkit/sdout.zip /

delete /config/ultrahand/downloads/hoc-toolkit/

; --- nx-ovlloader reboot if necessary ---
json_file '/atmosphere/contents/420000000007E51A/toolbox.json'
json '{"null":"reboot","{json_file(version)}":";pass"}'
'{json({ovlloader_version})}' ovlloader

ini_file '/config/ultrahand/downloads/ULTRAHAND_RELEASE.ini'
json '{"null":"to_packages","{ini_file(Release Info,latest_version)}":"package"}'
delete '/config/ultrahand/downloads/ULTRAHAND_RELEASE.ini'
exit '{json({ultrahand_version})}'



