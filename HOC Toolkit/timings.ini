;show_widget=true


[Timings]

[*Presets]
;mode=forwarder
package_source './timing_presets.ini'

[gap]
;mode=table
;background=false
;gap=20

[*Read Latency?RAMmariko]
;system=mariko
;mode=option
json_file_source './json/mariko_read_latency.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 132 {json_file_source(*,hex)}
set-footer '{json_file_source(*,name)}'

[*Write Latency?RAMmariko]
;system=mariko
;mode=option
json_file_source './json/mariko_write_latency.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 136 {json_file_source(*,hex)}
set-footer '{json_file_source(*,name)}'

[*Read Latency?RAMerista]
;system=erista
;mode=option
json_file_source './json/read_latency.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 132 {json_file_source(*,hex)}
set-footer '{json_file_source(*,name)}'

[*Write Latency?RAMerista]
;system=erista
;mode=option
json_file_source './json/write_latency.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 136 {json_file_source(*,hex)}
set-footer '{json_file_source(*,name)}'

[*Advanced Latency?RAMmariko]
;system=mariko
;mode=forwarder
package_source './advanced_ram_latency.ini'

[gap]
;mode=table
;background=false
;gap=20

[*T1 tRCD]
;mode=option
;mini=true
;selection_mini=true
json_file_source './json/t1_trcd.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 52 {json_file_source(*,hex)}
set-footer '{json_file_source(*,name)}'
