;show_widget=true

[@TimingsPage]

[Timings?header]
;mode=table
;polling=true
;background=false
;header_indent=true
;section_text_color=header
;info_text_color=section
ini_file './config.ini'
'Timings' = '{ini_file(*Timings,footer)}'

[*T1 tRCD]
;mode=option
;mini=true
;selection_mini=true
json_file_source './json/t1_trcd.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 52 {json_file_source(*,hex)}
mv ./notifications/hoc-reboot_required_once.notify /config/ultrahand/notifications/
set-footer '{json_file_source(*,name)}'
exec cUpdateTimings
; --- sync changed value into hoc-clk config.ini when flag present (no kip reread) ---
try:
path_exists ./flags/UPDATE_HOC_CONFIG.flag
set-ini-val /config/horizon-oc/config.ini values t1_trcd {hex_to_decimal({hex_to_rhex({json_file_source(*,hex)})})}
set-ini-val /config/horizon-oc/config.ini values is_first_load 1
try:
pass

