;Mariko T4 uses newer EOS-Pro steps. Legacy Switchcraft T4=0 (10/40) - NaGa
;has no direct equivalent and is clamped to newer T4=0 (7.5/30).
;show_widget=true

[@Default]
[Default]
;mode=table
;background=false
;spacing=4
;gap=20
;header_indent=true
;info_text_color=section
;section_text_color=header
'Default' = 'Preset Profiles'

[D00]
;mode=table
;background=false
;spacing=4
;gap=15
'' = 'Stock'

[00 - (0-0-0) 0-0-0-0-0]
;mini=true
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 52 00000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 56 00000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 60 00000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 64 00000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 68 00000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 72 00000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 76 00000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 80 00000000
mv ./../../notifications/hoc-reboot_required_once.notify /config/ultrahand/notifications/
exec main_boot ./../../boot_package.ini
; --- sync changed value into hoc-clk config.ini when flag present (no kip reread) ---
try:
path_exists ./../../flags/UPDATE_HOC_CONFIG.flag
set-ini-val /config/horizon-oc/config.ini values t1_trcd 0
set-ini-val /config/horizon-oc/config.ini values t2_trp 0
set-ini-val /config/horizon-oc/config.ini values t3_tras 0
set-ini-val /config/horizon-oc/config.ini values t4_trrd 0
set-ini-val /config/horizon-oc/config.ini values t5_trfc 0
set-ini-val /config/horizon-oc/config.ini values t6_trtw 0
set-ini-val /config/horizon-oc/config.ini values t7_twtr 0
set-ini-val /config/horizon-oc/config.ini values t8_trefi 0
set-ini-val /config/horizon-oc/config.ini values is_first_load 1
try:
pass


[gap]
;mode=table
;background=false
;gap=10

[D01]
;mode=table
;background=false
;spacing=4
;gap=15
'' = 'Level 1'

[01 - (3-3-2) 0-1-4-3-6]
;mini=true
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 52 03000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 56 03000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 60 02000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 64 00000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 68 01000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 72 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 76 03000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 80 06000000
mv ./../../notifications/hoc-reboot_required_once.notify /config/ultrahand/notifications/
exec main_boot ./../../boot_package.ini
; --- sync changed value into hoc-clk config.ini when flag present (no kip reread) ---
try:
path_exists ./../../flags/UPDATE_HOC_CONFIG.flag
set-ini-val /config/horizon-oc/config.ini values t1_trcd 3
set-ini-val /config/horizon-oc/config.ini values t2_trp 3
set-ini-val /config/horizon-oc/config.ini values t3_tras 2
set-ini-val /config/horizon-oc/config.ini values t4_trrd 0
set-ini-val /config/horizon-oc/config.ini values t5_trfc 1
set-ini-val /config/horizon-oc/config.ini values t6_trtw 4
set-ini-val /config/horizon-oc/config.ini values t7_twtr 3
set-ini-val /config/horizon-oc/config.ini values t8_trefi 6
set-ini-val /config/horizon-oc/config.ini values is_first_load 1
try:
pass
