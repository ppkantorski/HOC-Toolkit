;Mariko T4 values are shifted to the newer EOS-Pro numbering. - NaGa
;Legacy Switchcraft T4=0 (10/40) is clamped to newer T4=0 (7.5/30).

;show_widget=true

[@Hynix]
[Hynix]
;mode=table
;background=false
;spacing=4
;gap=20
;header_indent=true
;info_text_color=section
;section_text_color=header
'Hynix' = 'Preset Profiles'


[NEE Common]
;system=mariko
;mode=table
;background=false
;spacing=4
;gap=15
'' = 'Common'

[NEE - (3-3-2) 1-5-5-4-6]
;system=mariko
;mini=true
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 52 03000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 56 03000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 60 02000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 64 01000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 68 05000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 72 05000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 76 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 80 06000000
mv ./../../notifications/hoc-reboot_required_once.notify /config/ultrahand/notifications/
exec main_boot ./../../boot_package.ini
; --- sync changed value into hoc-clk config.ini when flag present (no kip reread) ---
try:
path_exists ./../../flags/UPDATE_HOC_CONFIG.flag
set-ini-val /config/horizon-oc/config.ini values t1_trcd 3
set-ini-val /config/horizon-oc/config.ini values t2_trp 3
set-ini-val /config/horizon-oc/config.ini values t3_tras 2
set-ini-val /config/horizon-oc/config.ini values t4_trrd 1
set-ini-val /config/horizon-oc/config.ini values t5_trfc 5
set-ini-val /config/horizon-oc/config.ini values t6_trtw 5
set-ini-val /config/horizon-oc/config.ini values t7_twtr 4
set-ini-val /config/horizon-oc/config.ini values t8_trefi 6
set-ini-val /config/horizon-oc/config.ini values is_first_load 1
try:
pass


[gap]
;system=mariko
;mode=table
;background=false
;gap=10

[NEE ST]
;system=mariko
;mode=table
;background=false
;spacing=4
;gap=15
'' = 'ST'

[NEE - (4-4-4) 2-7-6-5-6]
;system=mariko
;mini=true
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 52 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 56 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 60 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 64 02000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 68 07000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 72 06000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 76 05000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 80 06000000
mv ./../../notifications/hoc-reboot_required_once.notify /config/ultrahand/notifications/
exec main_boot ./../../boot_package.ini
; --- sync changed value into hoc-clk config.ini when flag present (no kip reread) ---
try:
path_exists ./../../flags/UPDATE_HOC_CONFIG.flag
set-ini-val /config/horizon-oc/config.ini values t1_trcd 4
set-ini-val /config/horizon-oc/config.ini values t2_trp 4
set-ini-val /config/horizon-oc/config.ini values t3_tras 4
