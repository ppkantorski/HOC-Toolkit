;Mariko T4 values are shifted to the newer EOS-Pro numbering. - NaGa
;Legacy Switchcraft T4=0 (10/40) is clamped to newer T4=0 (7.5/30).

;show_widget=true

[@Hynix]
[Hynix]
;mode=table
;background=false
;spacing=4
;gap=20
;header_indent=true
;info_text_color=section
;section_text_color=header
'Hynix' = 'Preset Profiles'


[NEE Common]
;system=mariko
;mode=table
;background=false
;spacing=4
;gap=15
'' = 'Common'

[NEE - (3-3-2) 1-5-5-4-6]
;system=mariko
;mini=true
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 52 03000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 56 03000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 60 02000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 64 01000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 68 05000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 72 05000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 76 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 80 06000000
exec boot ./../../boot_package.ini


[gap]
;system=mariko
;mode=table
;background=false
;gap=10

