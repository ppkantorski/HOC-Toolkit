;Mariko T4 values are shifted to the newer EOS-Pro numbering. - NaGa
;show_widget=true


[@Samsung]
[Samsung]
;mode=table
;background=false
;spacing=4
;gap=20
;header_indent=true
;info_text_color=section
;section_text_color=header
'Samsung' = 'Preset Profiles'


[Samsung AA-MGCL Common]
;system=mariko
;mode=table
;background=false
;spacing=4
;gap=15
'' = 'Common'

[AA-MGCL - (4-4-5) 4-5-6-7-6]
;system=mariko
;mini=true
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 52 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 56 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 60 05000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 64 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 68 05000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 72 06000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 76 07000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 80 06000000
mv ./../../notifications/hoc-reboot_required_once.notify /config/ultrahand/notifications/
exec boot ./../../boot_package.ini


