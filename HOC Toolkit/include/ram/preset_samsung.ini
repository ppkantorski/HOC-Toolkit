;Mariko T4 values are shifted to the newer EOS-Pro numbering. - NaGa
;show_widget=true


[@Samsung]
[Samsung]
;mode=table
;background=false
;spacing=4
;gap=20
;header_indent=true
;info_text_color=section
;section_text_color=header
'Samsung' = 'Preset Profiles'


[Samsung AA-MGCL Common]
;system=mariko
;mode=table
;background=false
;spacing=4
;gap=15
'' = 'Common'

[AA-MGCL - (4-4-5) 4-5-6-7-6]
;system=mariko
;mini=true
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 44 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 48 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 52 05000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 56 04000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 60 05000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 64 06000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 68 07000000
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 72 06000000
mv ./../../notifications/hoc-reboot_required_once.notify /config/ultrahand/notifications/
exec main_boot ./../../boot_package.ini
; --- sync changed value into hoc-clk config.ini when flag present (no kip reread) ---
try:
path_exists ./../../flags/UPDATE_HOC_CONFIG.flag
set-ini-val /config/horizon-oc/config.ini values t1_trcd 4
set-ini-val /config/horizon-oc/config.ini values t2_trp 4
set-ini-val /config/horizon-oc/config.ini values t3_tras 5
set-ini-val /config/horizon-oc/config.ini values t4_trrd 4
set-ini-val /config/horizon-oc/config.ini values t5_trfc 5
set-ini-val /config/horizon-oc/config.ini values t6_trtw 6
set-ini-val /config/horizon-oc/config.ini values t7_twtr 7
set-ini-val /config/horizon-oc/config.ini values t8_trefi 6
set-ini-val /config/horizon-oc/config.ini values is_first_load 1
try:
pass


