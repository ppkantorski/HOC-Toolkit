;show_version=true
;show_widget=true

[@Main Presets]

[RAM]
;mode=table
;background=false
;header_indent=true
;section_text_color=header
;info_text_color=section
json_file './json/ram_model.json'
'RAM' = '{ram_vendor} {json_file(0,{ram_model})}'

[RAM Table]
;mode=table
;spacing=4
;gap=28
hex_file '/atmosphere/kips/hoc.kip'

json_file './json/numbers_lookup.json'
'Timings' = '({json_file(0,{hex_file(CUST,52,4)})}-{json_file(0,{hex_file(CUST,56,4)})}-{json_file(0,{hex_file(CUST,60,4)})}) {json_file(0,{hex_file(CUST,64,4)})}-{json_file(0,{hex_file(CUST,68,4)})}-{json_file(0,{hex_file(CUST,72,4)})}-{json_file(0,{hex_file(CUST,76,4)})}-{json_file(0,{hex_file(CUST,80,4)})}'

mariko:
json_file './json/frequency_lookup.json'
'Max Clock' = '{json_file(0,{hex_file(CUST,36,4)})} (△{json_file(1,{hex_file(CUST,32,4)})})'
json_file './json/emc_mem_volt_lookup.json'
'Vdd2' = {json_file(0,{hex_file(CUST,16,4)})}
json_file './mariko/ram_vddq_lookup.json'
'Vddq' = {json_file(0,{hex_file(CUST,40,4)})}
json_file './json/soc_dvb_shift_lookup.json'
'SOC DVB' = {json_file(0,{hex_file(CUST,44,4)})}
json '[{"00000000":"Off", "01000000":"On"}]'
'HP Mode' = {json(0,{hex_file(CUST,12,4)})}
json_file './json/frequency_lookup.json'
'Latency' = {json_file(0,{hex_file(CUST,132,4)})}{json_file(0,{hex_file(CUST,136,4)})}

erista:
'Vdd2' = {json_file(0,{hex_file(CUST,16,4)})}
