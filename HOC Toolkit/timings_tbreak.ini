;show_widget=true

[@TBreak]

[TBreak?header]
;mode=table
;polling=true
;background=false
;header_indent=true
;section_text_color=header
;info_text_color=section
ini_file './config.ini'
'TBreak' = '{ini_file(*TBreak,footer)}'

[*Max Clock?timings_tbreak]
;mode=option
;selection_mini=true
json_file_source './json/timing_tbreak.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 76 {json_file_source(*,hex)}
set-ini-val './config.ini' 'globals' 'crc32' '{crc32(/atmosphere/kips/hoc.kip)}'
set-footer '{json_file_source(*,name)}'
exec cUpdateTimings
; --- sync changed value into hoc-clk config.ini when flag present (no kip reread) ---
try:
path_exists ./flags/UPDATE_HOC_CONFIG.flag
set-ini-val /config/horizon-oc/config.ini values timingEmcTbreak {hex_to_decimal({hex_to_rhex({json_file_source(*,hex)})})}
set-ini-val /config/horizon-oc/config.ini values is_first_load 1
mv ./notifications/hoc-reboot_required_once.notify /config/ultrahand/notifications/
back
try:
mv ./notifications/hoc-reboot_required_once.notify /config/ultrahand/notifications/
back

[gap]
;mode=table
;background=false
;gap=20

