[@Tools]

[Tools]
[*Info]
;mode=forwarder
package_source './info.ini'

[*Backup System]
;mode=forwarder
exec cBackupSystem
package_source './backup.ini'

[*System Settings]
;mode=forwarder
exec cSystemSettings
package_source './system-settings.ini'

[*Reboot To]
[*Boot Entry]
ini_file_source /bootloader/hekate_ipl.ini
filter config
reboot boot '{ini_file_source(*)}'
[hekate - ]
reboot HEKATE
[hekate UMS - ]
reboot UMS

