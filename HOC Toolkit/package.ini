[@Tools]

[Tools]
[*Info]
;mode=forwarder
package_source './include/info/info.ini'

[*Backup System]
;mode=forwarder
package_source './include/backup/backup.ini'

[*AMS Settings]
;mode=forwarder
package_source './include/settings/ams_settings.ini'
exec cAMSSettings ./global_cmds.ini

[*hekate Settings]
;mode=forwarder
package_source './include/settings/hekate_settings.ini'


[*Software Update]
;mode=forwarder
package_source './software_update.ini'
exec cStageUpdateMenu ./global_cmds.ini


[Apply Changes]

[*Reboot To]
[*Boot Entry]
ini_file_source /bootloader/hekate_ipl.ini
filter config
reboot boot '{ini_file_source(*)}'
[hekate - ]
reboot HEKATE
[hekate UMS - ]
reboot UMS
