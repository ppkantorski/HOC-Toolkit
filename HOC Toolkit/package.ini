set-footer '{json_file_source(*,name)}'

[HP Mode]
;mode=toggle
on:
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 12 01000000
off:
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 12 00000000

