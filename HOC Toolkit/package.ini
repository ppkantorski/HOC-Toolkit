;title='HOC Toolkit'
;creator='ppkantorski, B3711, NaGa, MestreYodaRossi'
;about='This package was designed for advance oc configurations on HOC v2.1.0. Use with caution and proper guidance.'
;version=2.0.0
;color=red
;show_widget=true

[@Settings]

[RAM]
;mode=table
;background=false
;header_indent=true
;section_text_color=header
;info_text_color=section
json_file './json/ram_model.json'
'RAM' = '{ram_vendor} {json_file(0,{ram_model})}'


[*Timings]
;mode=forwarder
package_source './timings.ini'

[*Max Clock?RAMmariko]
;system=mariko
;mode=option
;selection_mini=true
json_file_source './mariko/ram_freqs.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 36 {json_file_source(*,hex)}
set-footer '{json_file_source(*,name)}'

[*Step Mode]
;mode=option
json_file_source './json/step_mode.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 32 {json_file_source(*,hex)}
set-footer '{json_file_source(*,name)}'

[*Max Clock?RAMerista]
;system=erista
;mode=option
;selection_mini=true
json_file_source './erista/ram_freqs.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 20 {json_file_source(*,hex)}
set-footer '{json_file_source(*,name)}'

[*RAM Frequency Editor?RAMerista]
;system=erista
;mode=forwarder
package_source './ram_erista.ini'

[*Vdd2]
;mode=option
;selection_mini=true
json_file_source './json/emc_mem_volt.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 16 {json_file_source(*,hex)}
set-footer '{json_file_source(*,name)}'

