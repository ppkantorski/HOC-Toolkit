[@Tools]

[Tools]
[*Info]
;mode=forwarder
package_source './info.ini'

[*Backup System]
;mode=forwarder
exec cBackupSystem
package_source './backup.ini'

[*System Settings]
;mode=forwarder
exec cSystemSettings
package_source './system_settings.ini'

; ── Shared: system settings (single ini_file load covers all three writes) ────
ini_file '/atmosphere/config/system_settings.ini'
json '[{"null":"Off", "u8!0x1":"On", "u8!0x0":"Off"}]'
set-ini-val './config.ini' 'GPU Scheduling' footer {json(0,{ini_file(am.gpu,gpu_scheduling_enabled)})}
set-ini-val './config.ini' 'Always Save Cheats Toggles' footer {json(0,{ini_file(atmosphere,dmnt_always_save_cheat_toggles)})}
set-ini-val './config.ini' 'Controller Sync' footer {json(0,{ini_file(atmosphere,enable_external_bluetooth_db)})}

ini_file '/atmosphere/config/override_config.ini'
json '[{"null":"Off", "R":"On", "!R":"Off"}]'
set-ini-val './config.ini' 'Hold R for HB Menu' footer {json(0,{ini_file(hbl_config,override_key)})}


[*Software Update]
;mode=forwarder
package_source './software_update.ini'
hex_file /atmosphere/kips/hoc.kip

try:
download https://github.com/ppkantorski/HOC-Toolkit/raw/refs/heads/main/RELEASE.ini './RELEASE.ini'
ini_file './RELEASE.ini'
set-ini-val './config.ini' 'Update Horizon OC' footer '{ini_file(Release Info,latest_hoc)}'
json '{"null":"true","{slice({hex_to_decimal({hex_to_rhex({hex_file(CUST,8,4)})})},0,1)}.{slice({hex_to_decimal({hex_to_rhex({hex_file(CUST,8,4)})})},1,2)}.{slice({hex_to_decimal({hex_to_rhex({hex_file(CUST,8,4)})})},2,3)}":"false"}'
set-ini-val ./config.ini 'Update Horizon OC' footer_highlight '{json({ini_file(Release Info,latest_hoc)})}'

set-ini-val './config.ini' 'Update HOC Toolkit' footer '{ini_file(Release Info,latest_hoc_toolkit)}'
json '{"null":"true","{package_version}":"false"}'
set-ini-val ./config.ini 'Update HOC Toolkit' footer_highlight '{json({ini_file(Release Info,latest_hoc_toolkit)})}'

set-ini-val './config.ini' 'Update sys-clk' footer '{ini_file(Release Info,latest_sys-clk)}'
hex_file /switch/.overlays/sys-clk-overlay.ovl
json '{"null":"true","{ascii_to_hex({ini_file(Release Info,latest_sys-clk)})}":"false"}'
set-ini-val './config.ini' 'Update sys-clk' footer_highlight '{json({hex_file(2.0.1,0,9)})}'

set-ini-val './config.ini' 'Update sys-clk-hoc' footer '{ini_file(Release Info,latest_sys-clk-hoc)}'
ini_file '/config/sys-clk/RELEASE.ini'
json '{"null":"true","{ini_file(Release Info,latest_version)}":"false"}'
set-ini-val './config.ini' 'Update sys-clk' footer_highlight '{json({ini_file(Release Info,latest_sys-clk-hoc)})}'

[Apply Changes]
[*Reboot To]
[*Boot Entry]
ini_file_source /bootloader/hekate_ipl.ini
filter config
reboot boot '{ini_file_source(*)}'
[hekate - ]
reboot HEKATE
[hekate UMS - ]
reboot UMS

