[@Settings]

[RAM]
;mode=table
;background=false
;header_indent=true
;section_text_color=header
;info_text_color=section
json_file './json/ram_model.json'
'RAM' = '{ram_vendor} {json_file(0,{ram_model})}'


[*Timings]
;mode=forwarder
package_source './timings.ini'

[*Max Clock?RAMmariko]
;system=mariko
;mode=option
;selection_mini=true
json_file_source './mariko/ram_freqs.json' label
hex-by-custom-offset /atmosphere/kips/hoc.kip CUST 36 {json_file_source(*,hex)}
set-footer '{json_file_source(*,name)}'

[*Step Mode]
;mode=option
json_file_source './json/step_mode.json' label
