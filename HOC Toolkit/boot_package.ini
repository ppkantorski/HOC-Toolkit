[cHandleKipMatch]
mv './main_menu.ini' './package.ini'

[cHandleKipMismatch]
notify-now "KIP Rev mismatch!" 8000 "HOC Toolkit" hoc
exec cHandleRenamePackage
try:
cp './software_update.ini' './package.ini'
exec cStageUpdateMenu ./global_cmds.ini
force_failure

[cHandleRenamePackage]
try:
!path_exists ./main_menu.ini
mv './package.ini' './main_menu.ini'
try:
pass

[cUpdateTimings]
hex_file '/atmosphere/kips/hoc.kip'
json_file './json/numbers_lookup.json'
set-ini-val './config.ini' '*Timings' footer '({json_file(0,{hex_file(CUST,52,4)})}-{json_file(0,{hex_file(CUST,56,4)})}-{json_file(0,{hex_file(CUST,60,4)})}) {json_file(0,{hex_file(CUST,64,4)})}-{json_file(0,{hex_file(CUST,68,4)})}-{json_file(0,{hex_file(CUST,72,4)})}-{json_file(0,{hex_file(CUST,76,4)})}-{json_file(0,{hex_file(CUST,80,4)})}'

