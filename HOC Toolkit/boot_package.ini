[boot]
clear hex_sum_cache
hex_file '/atmosphere/kips/hoc.kip'
; KIP rev is hardcoded here for this version of OC Toolkit
json '{"5":"cHandleKipMatch","null":"cHandleKipMismatch"}'

try:
!path_exists '/atmosphere/kips/hoc.kip'
exec cHandleKipMismatch
try:
exec '{json({hex_to_decimal({hex_to_rhex({hex_file(CUST,4,4)})})})}'

ini_file './config.ini'
json '{"{ini_file(globals,crc32)}":"pass","null":"exec"}'
{json({crc32(/atmosphere/kips/hoc.kip)})} main_boot

path_exists './flags/TRIGGER_MAIN_BOOT.flag'
exec main_boot
try:
pass

