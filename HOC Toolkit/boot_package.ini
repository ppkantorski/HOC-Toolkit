[boot]
clear hex_sum_cache
hex_file '/atmosphere/kips/hoc.kip'
; KIP rev is hardcoded here for this version of OC Toolkit
json '{"3":"cHandleKipMatch","null":"cHandleKipMismatch"}'

try:
!path_exists '/atmosphere/kips/hoc.kip'
exec cHandleKipMismatch
try:
exec '{json({hex_to_decimal({hex_to_rhex({hex_file(CUST,4,4)})})})}'

exec main_boot

[main_boot]
try:
path_exists '/atmosphere/kips/hoc.kip'
hex_file '/atmosphere/kips/hoc.kip'

; ── Shared: RAM step mode ─────────────────────────────────────────────────────
json_file './json/step_mode_lookup.json'
set-ini-val './config.ini' '*Step Mode' footer {json_file(0,{hex_file(CUST,32,4)})}

; ── Shared: timings (T1-T3, T5-T8; T4 differs per platform) ──────────────────
