[boot]
clear hex_sum_cache
hex_file '/atmosphere/kips/hoc.kip'

; ── Shared: RAM step mode ─────────────────────────────────────────────────────
json_file './json/step_mode_lookup.json'
set-ini-val './config.ini' '*Step Mode' footer {json_file(0,{hex_file(CUST,32,4)})}

; ── Shared: timings (T1-T3, T5-T8; T4 differs per platform) ──────────────────
json_file './json/t1_trcd_lookup.json'
set-ini-val './config.ini' '*T1 tRCD' footer {json_file(0,{hex_file(CUST,52,4)})}
set-ini-val './config.ini' '*T2 tRP' footer {json_file(0,{hex_file(CUST,56,4)})}

json_file './json/t3_tras_lookup.json'
set-ini-val './config.ini' '*T3 tRAS' footer {json_file(0,{hex_file(CUST,60,4)})}

json_file './json/t5_trfc_lookup.json'
set-ini-val './config.ini' '*T5 tRFC' footer {json_file(0,{hex_file(CUST,68,4)})}

json_file './json/t6_trtw_lookup.json'
set-ini-val './config.ini' '*T6 tRTW' footer {json_file(0,{hex_file(CUST,72,4)})}
set-ini-val './config.ini' '*T7 tWTR' footer {json_file(0,{hex_file(CUST,76,4)})}

json_file './json/t8_trefi_lookup.json'
set-ini-val './config.ini' '*T8 tREFI' footer {json_file(0,{hex_file(CUST,80,4)})}

; ── Shared: memory voltages ───────────────────────────────────────────────────
json '[{"00000000":"Off", "01000000":"On"}]'
set-ini-val './config.ini' 'HP Mode' footer {json(0,{hex_file(CUST,12,4)})}

json_file './json/emc_mem_volt_lookup.json'
set-ini-val './config.ini' '*Vdd2' footer {json_file(0,{hex_file(CUST,16,4)})}

json_file './json/soc_dvb_shift_lookup.json'
set-ini-val './config.ini' '*EMC DVB Table' footer {json_file(0,{hex_file(CUST,44,4)})}
set-ini-val './config.ini' '*EMC DVB Table' mode named_step_trackbar
json_file './json/numbers.json'
set-ini-val './config.ini' '*EMC DVB Table' index {json_file(0,{hex_file(CUST,44,1)})}

json_file './json/gpu_offset_lookup.json'
set-ini-val './config.ini' '*Voltage Offset' footer {json_file(0,{hex_file(CUST,212,4)})}

; ── Shared: system settings (single ini_file load covers all three writes) ────
ini_file '/atmosphere/config/system_settings.ini'
json '[{"null":"Off", "u8!0x1":"On", "u8!0x0":"Off"}]'
set-ini-val './config.ini' 'GPU Scheduling' footer {json(0,{ini_file(am.gpu,gpu_scheduling_enabled)})}
set-ini-val './config.ini' 'Always Save Cheats Toggles' footer {json(0,{ini_file(atmosphere,dmnt_always_save_cheat_toggles)})}
set-ini-val './config.ini' 'Controller Sync' footer {json(0,{ini_file(atmosphere,enable_external_bluetooth_db)})}

ini_file '/atmosphere/config/override_config.ini'
json '[{"null":"Off", "R":"On", "!R":"Off"}]'
set-ini-val './config.ini' 'Hold R for HB Menu' footer {json(0,{ini_file(hbl_config,override_key)})}

exec cUpdateTimings

