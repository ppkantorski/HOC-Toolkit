name: Update Release Info
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  update-release-ini:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Load overrides from RESTRICT_RELEASE.ini
        run: |
          parse_ini() {
            local section="$1" key="$2"
            [[ -f RESTRICT_RELEASE.ini ]] || { echo ""; return; }
            python3 -c "import configparser,sys;c=configparser.ConfigParser();c.read('RESTRICT_RELEASE.ini');print(c.get(sys.argv[1],sys.argv[2],fallback=''))" "$section" "$key"
          }
          {
            echo "R_TOOLKIT_VER=$(parse_ini 'HOC Toolkit' version)"
            echo "R_TOOLKIT_FILE=$(parse_ini 'HOC Toolkit' filename)"
            echo "R_HOC_VER=$(parse_ini 'Horizon OC' version)"
            echo "R_HOC_FILE=$(parse_ini 'Horizon OC' filename)"
            echo "R_SYSCLK_HOC_VER=$(parse_ini 'sys-clk-hoc' version)"
            echo "R_SYSCLK_HOC_FILE=$(parse_ini 'sys-clk-hoc' filename)"
            echo "R_SYSCLK_VER=$(parse_ini 'sys-clk' version)"
            echo "R_SYSCLK_FILE=$(parse_ini 'sys-clk' filename)"
            echo "R_STATUS_VER=$(parse_ini 'Status Monitor' version)"
            echo "R_STATUS_FILE=$(parse_ini 'Status Monitor' filename)"
            echo "R_HEKATE_VER=$(parse_ini 'Hekate' version)"
            echo "R_HEKATE_FILE=$(parse_ini 'Hekate' filename)"
            echo "R_AMS_VER=$(parse_ini 'Atmosphere' version)"
            echo "R_AMS_FILE=$(parse_ini 'Atmosphere' filename)"
          } >> "$GITHUB_ENV"

      - name: Fetch latest releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Returns "version|filename" — asset_pattern is a jq-compatible regex
          fetch_release() {
            local repo="$1" pattern="$2"
            local json
            json=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/releases/latest" 2>/dev/null) \
              || { echo "|"; return; }
            local ver file
            ver=$(echo "$json" | jq -r '.tag_name // "" | ltrimstr("v")')
            file=$(echo "$json" | jq -r --arg p "$pattern" \
              '[.assets[].name | select(test($p))] | first // ""')
            echo "${ver}|${file}"
          }

          # Writes PREFIX_VER and PREFIX_FILE to GITHUB_ENV,
          # applying per-field overrides where provided
          set_vars() {
            local prefix="$1" fetched="$2" r_ver="$3" r_file="$4"
            local ver="${r_ver:-$(echo "$fetched" | cut -d'|' -f1)}"
            local file="${r_file:-$(echo "$fetched" | cut -d'|' -f2-)}"
            {
              echo "${prefix}_VER=${ver}"
              echo "${prefix}_FILE=${file}"
            } >> "$GITHUB_ENV"
          }

          set_vars TOOLKIT \
            "$(fetch_release ppkantorski/HOC-Toolkit '^hoc-toolkit\.zip$')" \
            "${R_TOOLKIT_VER}" "${R_TOOLKIT_FILE}"

          set_vars HOC \
            "$(fetch_release Horizon-OC/Horizon-OC '^dist\.zip$')" \
            "${R_HOC_VER}" "${R_HOC_FILE}"

          set_vars SYSCLK_HOC \
            "$(fetch_release ppkantorski/Horizon-OC '^sys-clk-hoc\.zip$')" \
            "${R_SYSCLK_HOC_VER}" "${R_SYSCLK_HOC_FILE}"

          set_vars SYSCLK \
            "$(fetch_release ppkantorski/sys-clk '^sys-clk-overlay\.(ovl|zip)$')" \
            "${R_SYSCLK_VER}" "${R_SYSCLK_FILE}"

          set_vars STATUS \
            "$(fetch_release ppkantorski/Status-Monitor-Overlay '^Status-Monitor-Overlay\.ovl$')" \
            "${R_STATUS_VER}" "${R_STATUS_FILE}"

          set_vars HEKATE \
            "$(fetch_release CTCaer/hekate '^hekate_.*\.zip$')" \
            "${R_HEKATE_VER}" "${R_HEKATE_FILE}"

          set_vars AMS \
            "$(fetch_release Atmosphere-NX/Atmosphere '^atmosphere-.*\.zip$')" \
            "${R_AMS_VER}" "${R_AMS_FILE}"

      - name: Write RELEASE.ini
        run: |
          {
            printf '[HOC Toolkit]\nversion=%s\nfilename=%s\n' \
              "${TOOLKIT_VER}" "${TOOLKIT_FILE}"
            printf '\n[Horizon OC]\nversion=%s\nfilename=%s\n' \
              "${HOC_VER}" "${HOC_FILE}"
            printf '\n[sys-clk-hoc]\nversion=%s\nfilename=%s\n' \
              "${SYSCLK_HOC_VER}" "${SYSCLK_HOC_FILE}"
            printf '\n[sys-clk]\nversion=%s\nfilename=%s\n' \
              "${SYSCLK_VER}" "${SYSCLK_FILE}"
            printf '\n[Status Monitor]\nversion=%s\nfilename=%s\n' \
              "${STATUS_VER}" "${STATUS_FILE}"
            printf '\n[Hekate]\nversion=%s\nfilename=%s\n' \
              "${HEKATE_VER}" "${HEKATE_FILE}"
            printf '\n[Atmosphere]\nversion=%s\nfilename=%s\n' \
              "${AMS_VER}" "${AMS_FILE}"
          } > RELEASE.ini
          echo "--- RELEASE.ini contents ---"
          cat RELEASE.ini

      - name: Commit and push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add RELEASE.ini
          git diff --staged --quiet || git commit -m 'chore: update RELEASE.ini [skip ci]'
          git push
