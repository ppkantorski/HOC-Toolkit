name: Update Release Info
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  update-release-ini:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Load overrides from RESTRICT_RELEASE.ini
        run: |
          parse_ini_key() {
            local key="$1"
            local file="RESTRICT_RELEASE.ini"
            if [[ -f "$file" ]]; then
              grep -E "^${key}\s*=" "$file" \
                | head -1 \
                | sed 's/^[^=]*=\s*//' \
                | tr -d '\r'
            fi
          }
          echo "RESTRICT_HOC=$(parse_ini_key latest_hoc)"                           >> "$GITHUB_ENV"
          echo "RESTRICT_TOOLKIT=$(parse_ini_key latest_hoc_toolkit)"               >> "$GITHUB_ENV"
          echo "RESTRICT_SYSCLK=$(parse_ini_key latest_sys-clk)"                    >> "$GITHUB_ENV"
          echo "RESTRICT_SYSCLK_HOC=$(parse_ini_key latest_sys-clk-hoc)"            >> "$GITHUB_ENV"
          echo "RESTRICT_STATUS_MONITOR=$(parse_ini_key latest_status_monitor)"     >> "$GITHUB_ENV"
          echo "RESTRICT_HEKATE=$(parse_ini_key latest_hekate)"                     >> "$GITHUB_ENV"
          echo "RESTRICT_AMS=$(parse_ini_key latest_ams)"                           >> "$GITHUB_ENV"
      - name: Fetch latest release versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fetch_version() {
            local repo="$1"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/releases/latest" \
              | jq -r '.tag_name // "" | ltrimstr("v")' \
              2>/dev/null || echo ""
          }
          # Use override if set, otherwise poll GitHub
          if [[ -n "${RESTRICT_HOC}" ]]; then
            HOC_VERSION="${RESTRICT_HOC}"
            echo "HOC: using restricted value '${HOC_VERSION}'"
          else
            HOC_VERSION=$(fetch_version "Horizon-OC/Horizon-OC")
          fi
          if [[ -n "${RESTRICT_TOOLKIT}" ]]; then
            TOOLKIT_VERSION="${RESTRICT_TOOLKIT}"
            echo "TOOLKIT: using restricted value '${TOOLKIT_VERSION}'"
          else
            TOOLKIT_VERSION=$(fetch_version "ppkantorski/HOC-Toolkit")
          fi
          if [[ -n "${RESTRICT_SYSCLK}" ]]; then
            SYSCLK_VERSION="${RESTRICT_SYSCLK}"
            echo "SYS-CLK: using restricted value '${SYSCLK_VERSION}'"
          else
            SYSCLK_VERSION=$(fetch_version "ppkantorski/sys-clk")
          fi
          if [[ -n "${RESTRICT_SYSCLK_HOC}" ]]; then
            SYSCLK_HOC_VERSION="${RESTRICT_SYSCLK_HOC}"
            echo "SYS-CLK-HOC: using restricted value '${SYSCLK_HOC_VERSION}'"
          else
            SYSCLK_HOC_VERSION=$(fetch_version "ppkantorski/Horizon-OC")
          fi
          if [[ -n "${RESTRICT_STATUS_MONITOR}" ]]; then
            STATUS_MONITOR_VERSION="${RESTRICT_STATUS_MONITOR}"
            echo "STATUS-MONITOR: using restricted value '${STATUS_MONITOR_VERSION}'"
          else
            STATUS_MONITOR_VERSION=$(fetch_version "ppkantorski/Status-Monitor-Overlay")
          fi
          if [[ -n "${RESTRICT_HEKATE}" ]]; then
            HEKATE_VERSION="${RESTRICT_HEKATE}"
            echo "HEKATE: using restricted value '${HEKATE_VERSION}'"
          else
            HEKATE_VERSION=$(fetch_version "CTCaer/hekate")
          fi
          if [[ -n "${RESTRICT_AMS}" ]]; then
            AMS_VERSION="${RESTRICT_AMS}"
            echo "AMS: using restricted value '${AMS_VERSION}'"
          else
            AMS_VERSION=$(fetch_version "Atmosphere-NX/Atmosphere")
          fi
          echo "HOC_VERSION=${HOC_VERSION}"                         >> "$GITHUB_ENV"
          echo "TOOLKIT_VERSION=${TOOLKIT_VERSION}"                 >> "$GITHUB_ENV"
          echo "SYSCLK_VERSION=${SYSCLK_VERSION}"                   >> "$GITHUB_ENV"
          echo "SYSCLK_HOC_VERSION=${SYSCLK_HOC_VERSION}"           >> "$GITHUB_ENV"
          echo "STATUS_MONITOR_VERSION=${STATUS_MONITOR_VERSION}"   >> "$GITHUB_ENV"
          echo "HEKATE_VERSION=${HEKATE_VERSION}"                   >> "$GITHUB_ENV"
          echo "AMS_VERSION=${AMS_VERSION}"                         >> "$GITHUB_ENV"
      - name: Write RELEASE.ini
        run: |
          printf '[Release Info]\nlatest_hoc=%s\nlatest_hoc_toolkit=%s\nlatest_sys-clk=%s\nlatest_sys-clk-hoc=%s\nlatest_status_monitor=%s\nlatest_hekate=%s\nlatest_ams=%s\n' \
            "${HOC_VERSION}" "${TOOLKIT_VERSION}" "${SYSCLK_VERSION}" "${SYSCLK_HOC_VERSION}" "${STATUS_MONITOR_VERSION}" "${HEKATE_VERSION}" "${AMS_VERSION}" > RELEASE.ini
          echo "--- RELEASE.ini contents ---"
          cat RELEASE.ini
      - name: Commit and push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add RELEASE.ini
          git diff --staged --quiet || git commit -m 'chore: update RELEASE.ini [skip ci]'
          git push
