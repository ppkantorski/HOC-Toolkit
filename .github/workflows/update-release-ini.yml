name: Update Release Info

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  update-release-ini:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch latest release versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fetch_version() {
            local repo="$1"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/releases/latest" \
              | jq -r '.tag_name // "" | ltrimstr("v")' \
              2>/dev/null || echo ""
          }

          HOC_VERSION=$(fetch_version "Horizon-OC/Horizon-OC")
          TOOLKIT_VERSION=$(fetch_version "ppkantorski/HOC-Toolkit")
          SYSCLK_VERSION=$(fetch_version "ppkantorski/sys-clk")

          echo "HOC_VERSION=${HOC_VERSION}"         >> "$GITHUB_ENV"
          echo "TOOLKIT_VERSION=${TOOLKIT_VERSION}" >> "$GITHUB_ENV"
          echo "SYSCLK_VERSION=${SYSCLK_VERSION}"   >> "$GITHUB_ENV"

      - name: Write RELEASE.ini
        run: |
          printf '[Release Info]\nlatest_hoc=%s\nlatest_toolkit=%s\nlatest_sys-clk=%s\n' \
            "${HOC_VERSION}" "${TOOLKIT_VERSION}" "${SYSCLK_VERSION}" > RELEASE.ini

          echo "--- RELEASE.ini contents ---"
          cat RELEASE.ini

      - name: Commit and push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add RELEASE.ini
          git diff --staged --quiet || git commit -m 'chore: update RELEASE.ini [skip ci]'
          git push
